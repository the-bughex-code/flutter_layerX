name: CI

on:
  push:
    branches: [main, dev-umair]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Analyze · Format · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (bundles Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Print versions
        run: flutter --version

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib bin test

      - name: Analyze (treat infos & warnings as errors)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: dart test

  smoke:
    name: Generated project compiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: dart pub get

      - name: Generate into a fresh app and analyze it
        run: |
          flutter create sample --project-name layerx_ci --platforms=android
          dart run bin/layerx.dart enable --path sample
          cd sample
          flutter analyze
          flutter test
